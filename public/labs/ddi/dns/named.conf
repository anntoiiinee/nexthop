// BIND : serveur DNS du lab ddi
key "ddns-key" {
    algorithm hmac-sha256;
    secret "bGFiLWRkbnMta2V5LWEtbmUtamFtYWlzLXJldXRpbGlzZXI=";
};

acl site { 10.20.0.0/16; 127.0.0.1; };

options {
    directory "/var/bind";
    listen-on { any; };
    listen-on-v6 { none; };
    recursion yes;                 // résolveur pour les postes du site…
    allow-recursion { site; };     // …et seulement pour eux
    allow-query { site; };
    dnssec-validation no;          // le lab n'a pas d'accès Internet par ce chemin
};

// Zone directe : nom → adresse
zone "corp.example.com" {
    type primary;
    file "dyn/db.corp.example.com";
    allow-update { key "ddns-key"; };   // seul Kea, avec la clé TSIG, peut ajouter des noms
};

// Zone inverse : adresse → nom (enregistrements PTR)
zone "10.20.10.in-addr.arpa" {
    type primary;
    file "dyn/db.10.20.10";
    allow-update { key "ddns-key"; };
};
