! r1 : routeur du site. VLAN 99 services (DHCP, DNS), VLAN 10 utilisateurs avec relais DHCP.
hostname r1
username admin privilege 15 role network-admin secret admin
!
vlan 10
   name USERS
!
vlan 99
   name SERVICES
!
interface Ethernet1
   description dhcp
   switchport access vlan 99
!
interface Ethernet2
   description dns
   switchport access vlan 99
!
interface Ethernet3
   description client1
   switchport access vlan 10
!
interface Ethernet4
   description client2
   switchport access vlan 10
!
interface Ethernet5
   description printer
   switchport access vlan 10
!
interface Vlan10
   description USERS
   ip address 10.20.10.1/24
   ! Relais DHCP : les DISCOVER en broadcast sont renvoyés en unicast au serveur Kea
   ip helper-address 10.20.99.10
!
interface Vlan99
   description SERVICES
   ip address 10.20.99.1/24
!
ip routing
!
end
