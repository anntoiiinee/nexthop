name: ddi

# Lab du chapitre « DDI : DNS, DHCP et IPAM » (formation Services et observabilité).
#   Utilisateurs 10.20.10.0/24 : client1, client2 et une imprimante, adresses obtenues en DHCP
#   Services     10.20.99.0/24 : dhcp (Kea, 10.20.99.10) et dns (BIND, 10.20.99.53)
# r1 (cEOS) route entre les deux et relaie les requêtes DHCP (ip helper-address).
# Kea met à jour le DNS tout seul à chaque bail (DDNS) : c'est l'intégration DDI.
# Les serveurs installent Kea et BIND au déploiement (accès Internet par le réseau de management).

topology:
  kinds:
    arista_ceos:
      image: ceos:latest
  nodes:
    r1:
      kind: arista_ceos
      startup-config: configs/r1.cfg
      labels: { graph-level: 2 }

    dhcp:
      kind: linux
      image: alpine:3.20
      labels: { graph-level: 1 }
      binds:
        - dhcp:/lab
      exec:
        - sh /lab/setup.sh

    dns:
      kind: linux
      image: alpine:3.20
      labels: { graph-level: 1 }
      binds:
        - dns:/lab
      exec:
        - sh /lab/setup.sh

    client1:
      kind: linux
      image: alpine:3.20
      labels: { graph-level: 3 }
      exec:
        - ip route del default
        - udhcpc -b -i eth1 -x hostname:client1

    client2:
      kind: linux
      image: alpine:3.20
      labels: { graph-level: 3 }
      exec:
        - ip route del default
        - udhcpc -b -i eth1 -x hostname:client2

    printer:
      kind: linux
      image: alpine:3.20
      labels: { graph-level: 3 }
      exec:
        # Adresse MAC fixe : l'imprimante a une réservation DHCP
        - ip link set eth1 address 02:00:00:00:00:99
        - ip route del default
        - udhcpc -b -i eth1 -x hostname:printer

  links:
    - endpoints: ["dhcp:eth1", "r1:eth1"]
    - endpoints: ["dns:eth1", "r1:eth2"]
    - endpoints: ["client1:eth1", "r1:eth3"]
    - endpoints: ["client2:eth1", "r1:eth4"]
    - endpoints: ["printer:eth1", "r1:eth5"]
