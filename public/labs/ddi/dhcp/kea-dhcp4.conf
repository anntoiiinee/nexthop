// Kea DHCPv4 : le serveur DHCP du lab ddi (chapitre « DDI : DNS, DHCP et IPAM »)
// Baux attribués : /var/lib/kea/kea-leases4.csv     Journal : /var/log/kea-dhcp4.log
{
"Dhcp4": {
    "interfaces-config": { "interfaces": [ "eth1" ] },

    // Base des baux : un simple fichier CSV dans le lab, une base de données en production
    "lease-database": { "type": "memfile", "name": "/var/lib/kea/kea-leases4.csv", "lfc-interval": 3600 },

    "valid-lifetime": 3600,
    "renew-timer": 1800,
    "rebind-timer": 3150,

    // Mise à jour DNS dynamique : à chaque bail, Kea demande à kea-dhcp-ddns d'enregistrer le nom
    "dhcp-ddns": { "enable-updates": true, "server-ip": "127.0.0.1", "server-port": 53001 },
    "ddns-qualifying-suffix": "corp.example.com.",
    "ddns-override-client-update": true,
    "ddns-replace-client-name": "never",

    "subnet4": [
        {
            "id": 10,
            "subnet": "10.20.10.0/24",
            "pools": [ { "pool": "10.20.10.100 - 10.20.10.199" } ],
            "option-data": [
                { "name": "routers", "data": "10.20.10.1" },
                { "name": "domain-name-servers", "data": "10.20.99.53" },
                { "name": "domain-name", "data": "corp.example.com" }
            ],
            // Réservation : l'imprimante reçoit toujours la même adresse, hors du pool
            "reservations": [
                { "hw-address": "02:00:00:00:00:99", "ip-address": "10.20.10.20", "hostname": "printer" }
            ]
        }
    ],

    "loggers": [ { "name": "kea-dhcp4", "output_options": [ { "output": "stdout" } ], "severity": "INFO" } ]
}
}
