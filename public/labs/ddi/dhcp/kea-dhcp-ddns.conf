// kea-dhcp-ddns : envoie les mises à jour DNS (RFC 2136), signées par une clé TSIG, au serveur BIND
{
"DhcpDdns": {
    "ip-address": "127.0.0.1",
    "port": 53001,
    "tsig-keys": [
        { "name": "ddns-key", "algorithm": "HMAC-SHA256", "secret": "bGFiLWRkbnMta2V5LWEtbmUtamFtYWlzLXJldXRpbGlzZXI=" }
    ],
    "forward-ddns": {
        "ddns-domains": [
            { "name": "corp.example.com.", "key-name": "ddns-key",
              "dns-servers": [ { "ip-address": "10.20.99.53" } ] }
        ]
    },
    "reverse-ddns": {
        "ddns-domains": [
            { "name": "10.20.10.in-addr.arpa.", "key-name": "ddns-key",
              "dns-servers": [ { "ip-address": "10.20.99.53" } ] }
        ]
    },
    "loggers": [ { "name": "kea-dhcp-ddns", "output_options": [ { "output": "stdout" } ], "severity": "INFO" } ]
}
}
