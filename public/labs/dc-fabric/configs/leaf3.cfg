! leaf3 : AS 65103, VTEP 10.255.1.13, passerelle anycast des VLAN 10, 20 (VRF PROD) et 30 (VRF DEV)
hostname leaf3
!
service routing protocols model multi-agent
!
username admin privilege 15 role network-admin secret admin
!
vlan 10
   name PROD-WEB
!
vlan 20
   name PROD-APP
!
vlan 30
   name DEV-WEB
!
vrf instance PROD
!
vrf instance DEV
!
interface Ethernet1
   description spine1
   mtu 9214
   no switchport
   ip address 10.0.1.5/31
!
interface Ethernet2
   description spine2
   mtu 9214
   no switchport
   ip address 10.0.2.5/31
!
interface Ethernet3
   description host3
   switchport access vlan 20
!
interface Ethernet4
   description host4
   switchport access vlan 30
!
interface Loopback0
   description ROUTER-ID / EVPN
   ip address 10.255.0.13/32
!
interface Loopback1
   description VTEP
   ip address 10.255.1.13/32
!
interface Vlan10
   description PROD-WEB
   vrf PROD
   ip address virtual 10.10.10.1/24
!
interface Vlan20
   description PROD-APP
   vrf PROD
   ip address virtual 10.10.20.1/24
!
interface Vlan30
   description DEV-WEB
   vrf DEV
   ip address virtual 10.10.10.1/24
!
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 10 vni 10010
   vxlan vlan 20 vni 10020
   vxlan vlan 30 vni 10030
   vxlan vrf PROD vni 50001
   vxlan vrf DEV vni 50002
!
ip virtual-router mac-address 00:1c:73:00:00:01
!
ip routing
ip routing vrf PROD
ip routing vrf DEV
!
router bgp 65103
   router-id 10.255.0.13
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   neighbor UNDERLAY peer group
   neighbor UNDERLAY remote-as 65000
   neighbor UNDERLAY send-community
   neighbor EVPN peer group
   neighbor EVPN remote-as 65000
   neighbor EVPN update-source Loopback0
   neighbor EVPN ebgp-multihop 3
   neighbor EVPN send-community extended
   neighbor 10.0.1.4 peer group UNDERLAY
   neighbor 10.255.0.1 peer group EVPN
   neighbor 10.0.2.4 peer group UNDERLAY
   neighbor 10.255.0.2 peer group EVPN
   !
   vlan 10
      rd 10.255.0.13:10010
      route-target both 10010:10010
      redistribute learned
   !
   vlan 20
      rd 10.255.0.13:10020
      route-target both 10020:10020
      redistribute learned
   !
   vlan 30
      rd 10.255.0.13:10030
      route-target both 10030:10030
      redistribute learned
   !
   address-family evpn
      neighbor EVPN activate
   !
   address-family ipv4
      neighbor UNDERLAY activate
      network 10.255.0.13/32
      network 10.255.1.13/32
   !
   vrf PROD
      rd 10.255.0.13:50001
      route-target import evpn 50001:50001
      route-target export evpn 50001:50001
      redistribute connected
   !
   vrf DEV
      rd 10.255.0.13:50002
      route-target import evpn 50002:50002
      route-target export evpn 50002:50002
      redistribute connected
!
end
