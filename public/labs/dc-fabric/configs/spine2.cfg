! spine2 : AS 65000, route l'underlay et relaie les routes EVPN sans être VTEP
hostname spine2
!
service routing protocols model multi-agent
!
username admin privilege 15 role network-admin secret admin
!
interface Management0
   ip address 172.20.40.12/24
!
management api http-commands
   no shutdown
!
interface Ethernet1
   description leaf1
   mtu 9214
   no switchport
   ip address 10.0.2.0/31
!
interface Ethernet2
   description leaf2
   mtu 9214
   no switchport
   ip address 10.0.2.2/31
!
interface Ethernet3
   description leaf3
   mtu 9214
   no switchport
   ip address 10.0.2.4/31
!
interface Loopback0
   description ROUTER-ID / EVPN
   ip address 10.255.0.2/32
!
ip routing
!
router bgp 65000
   router-id 10.255.0.2
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   neighbor UNDERLAY peer group
   neighbor UNDERLAY send-community
   neighbor EVPN peer group
   neighbor EVPN update-source Loopback0
   neighbor EVPN ebgp-multihop 3
   neighbor EVPN send-community extended
   neighbor EVPN next-hop-unchanged
   neighbor 10.0.2.1 peer group UNDERLAY
   neighbor 10.0.2.1 remote-as 65101
   neighbor 10.255.0.11 peer group EVPN
   neighbor 10.255.0.11 remote-as 65101
   neighbor 10.0.2.3 peer group UNDERLAY
   neighbor 10.0.2.3 remote-as 65102
   neighbor 10.255.0.12 peer group EVPN
   neighbor 10.255.0.12 remote-as 65102
   neighbor 10.0.2.5 peer group UNDERLAY
   neighbor 10.0.2.5 remote-as 65103
   neighbor 10.255.0.13 peer group EVPN
   neighbor 10.255.0.13 remote-as 65103
   !
   address-family evpn
      neighbor EVPN activate
   !
   address-family ipv4
      neighbor UNDERLAY activate
      network 10.255.0.2/32
!
end
