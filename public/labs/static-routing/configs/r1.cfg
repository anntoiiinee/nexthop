hostname r1
!
service routing protocols model multi-agent
!
username admin privilege 15 role network-admin secret admin
!
interface Ethernet1
   description LAN-agence
   no switchport
   ip address 192.168.10.1/26
!
interface Ethernet2
   description vers-r2
   no switchport
   ip address 192.168.10.120/31
!
ip routing
!
end
