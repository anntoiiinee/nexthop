hostname r3
!
service routing protocols model multi-agent
!
username admin privilege 15 role network-admin secret admin
!
interface Ethernet1
   description vers-r2
   no switchport
   ip address 10.0.23.1/31
!
interface Ethernet2
   description LAN-siege
   no switchport
   ip address 172.16.20.1/24
!
ip routing
!
end
