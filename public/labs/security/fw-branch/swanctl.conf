# fw-branch : VPN IPsec vers le siège (chapitre « VPN IPsec »)
# Recharger après une modification :
#   docker exec clab-security-fw-branch swanctl --load-all
connections {
    hq {
        version = 2
        local_addrs = 198.51.100.2
        remote_addrs = 203.0.113.2
        proposals = aes256gcm16-prfsha384-ecp384
        dpd_delay = 10s
        local {
            auth = psk
            id = fw-branch.example.com
        }
        remote {
            auth = psk
            id = fw-hq.example.com
        }
        children {
            net {
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                mark_in = 42
                mark_out = 42
                esp_proposals = aes256gcm16-ecp384
                start_action = start                  # l'agence initie le tunnel au démarrage
                dpd_action = restart                  # et le remonte si le siège ne répond plus
            }
        }
    }
}

secrets {
    ike-hq {
        id-1 = fw-branch.example.com
        id-2 = fw-hq.example.com
        secret = "lab-psk-a-ne-jamais-reutiliser"
    }
}
