name: security

# Lab de la formation « La sécurité ».
#   Siège   : utilisateurs 10.10.10.0/24, serveurs 10.10.20.0/24, DMZ 172.16.30.0/24, derrière fw-hq
#   Agence  : utilisateurs 10.20.10.0/24, derrière fw-branch
#   Internet: inet (cEOS) relie les deux firewalls et un utilisateur externe (ext, 192.0.2.10)
# Les firewalls sont des Linux (nftables pour le filtrage et le NAT, strongSwan pour le VPN IPsec).
# Leur script fw-*/setup.sh installe les paquets au déploiement (accès Internet par le réseau de management).

topology:
  kinds:
    arista_ceos:
      image: ceos:latest
  nodes:
    inet:
      kind: arista_ceos
      startup-config: configs/inet.cfg
      labels: { graph-level: 1 }

    ext:
      kind: linux
      image: nicolaka/netshoot:v0.13
      labels: { graph-level: 1 }
      exec:
        - ip addr add 192.0.2.10/24 dev eth1
        - ip route replace default via 192.0.2.1

    fw-hq:
      kind: linux
      image: alpine:3.20
      labels: { graph-level: 2 }
      sysctls:
        net.ipv4.ip_forward: 1
      binds:
        - fw-hq:/lab
      exec:
        - sh /lab/setup.sh

    fw-branch:
      kind: linux
      image: alpine:3.20
      labels: { graph-level: 2 }
      sysctls:
        net.ipv4.ip_forward: 1
      binds:
        - fw-branch:/lab
      exec:
        - sh /lab/setup.sh

    pc-hq:
      kind: linux
      image: nicolaka/netshoot:v0.13
      labels: { graph-level: 3 }
      exec:
        - ip addr add 10.10.10.10/24 dev eth1
        - ip route replace default via 10.10.10.1

    srv-hq:
      kind: linux
      image: nginx:1.27-alpine
      labels: { graph-level: 3 }
      exec:
        - ip addr add 10.10.20.10/24 dev eth1
        - ip route replace default via 10.10.20.1
        # Une « base de données » factice sur le port 5432
        - sh -c 'nohup nc -lk -p 5432 -e echo "base de donnees srv-hq" >/dev/null 2>&1 &'

    dmz-web:
      kind: linux
      image: nginx:1.27-alpine
      labels: { graph-level: 3 }
      exec:
        - ip addr add 172.16.30.10/24 dev eth1
        - ip route replace default via 172.16.30.1

    pc-branch:
      kind: linux
      image: nicolaka/netshoot:v0.13
      labels: { graph-level: 3 }
      exec:
        - ip addr add 10.20.10.10/24 dev eth1
        - ip route replace default via 10.20.10.1

  links:
    - endpoints: ["inet:eth1", "fw-hq:eth1"]
    - endpoints: ["inet:eth2", "fw-branch:eth1"]
    - endpoints: ["inet:eth3", "ext:eth1"]
    - endpoints: ["fw-hq:eth2", "pc-hq:eth1"]
    - endpoints: ["fw-hq:eth3", "srv-hq:eth1"]
    - endpoints: ["fw-hq:eth4", "dmz-web:eth1"]
    - endpoints: ["fw-branch:eth2", "pc-branch:eth1"]
