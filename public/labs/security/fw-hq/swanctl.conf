# fw-hq : VPN IPsec vers l'agence (chapitre « VPN IPsec »)
# Recharger après une modification :
#   docker exec clab-security-fw-hq swanctl --load-all
connections {
    branch {
        version = 2                                   # IKEv2
        local_addrs = 203.0.113.2
        remote_addrs = 198.51.100.2
        proposals = aes256gcm16-prfsha384-ecp384      # IKE SA : chiffrement, PRF, groupe DH 20
        dpd_delay = 10s                               # Dead Peer Detection
        local {
            auth = psk
            id = fw-hq.example.com
        }
        remote {
            auth = psk
            id = fw-branch.example.com
        }
        children {
            net {
                # VPN par route : tout est autorisé dans le tunnel, le routage choisit ce qui y entre
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                mark_in = 42                          # relié à l'interface VTI ipsec0 (key 42)
                mark_out = 42
                esp_proposals = aes256gcm16-ecp384    # Child SA (ESP) : chiffrement, PFS groupe 20
                start_action = none                   # le siège attend : c'est l'agence qui initie
                dpd_action = clear
            }
        }
    }
}

secrets {
    ike-branch {
        id-1 = fw-hq.example.com
        id-2 = fw-branch.example.com
        secret = "lab-psk-a-ne-jamais-reutiliser"
    }
}
