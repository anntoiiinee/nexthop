! inet : « Internet ». Il ne connaît que les adresses publiques, jamais les réseaux privés des sites.
hostname inet
username admin privilege 15 role network-admin secret admin
!
interface Ethernet1
   description fw-hq
   no switchport
   ip address 203.0.113.1/30
!
interface Ethernet2
   description fw-branch
   no switchport
   ip address 198.51.100.1/30
!
interface Ethernet3
   description ext
   no switchport
   ip address 192.0.2.1/24
!
ip routing
!
end
