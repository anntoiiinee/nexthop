# HAProxy du lab proxy-lb : reverse proxy et load balancer devant web1 et web2.
# Recharger après une modification (sans couper les connexions en cours) :
#   docker kill -s HUP clab-proxy-lb-lb

global
    log stdout format raw local0
    stats socket /var/run/haproxy.sock mode 600 level admin

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend fe_app
    bind :80
    # HTTPS (chapitre « TLS, certificats et inspection ») : décommenter la ligne suivante
    #bind :443 ssl crt /etc/ssl/lab/app.example.com.pem

    # Le serveur doit savoir qui est le vrai client et en quoi il est venu
    option forwardfor
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }

    # Routage par nom d'hôte
    acl host_admin hdr(host),field(1,:) -i admin.example.com
    use_backend be_admin if host_admin
    default_backend be_app

backend be_app
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server web1 198.51.100.11:80 check
    server web2 198.51.100.12:80 check

backend be_admin
    # L'administration n'est publiée que pour le LAN
    http-request deny if !{ src 192.0.2.0/26 }
    server web1 198.51.100.11:80 check

# Tableau de bord : http://198.51.100.10:8404 depuis le client
frontend stats
    bind :8404
    stats enable
    stats uri /
    stats refresh 5s
