# Squid, proxy sortant du lab proxy-lb (chapitres « Le proxy sortant » et « TLS, certificats et inspection »)
# Recharger après une modification :
#   docker exec clab-proxy-lb-proxy squid -f /etc/squid/lab/squid.conf -k reconfigure
# Journal des accès :
#   docker exec clab-proxy-lb-proxy tail -f /var/log/squid/access.log

http_port 3128

# Inspection TLS (exercice) : remplacer la ligne « http_port 3128 » ci-dessus par ce bloc
#http_port 3128 ssl-bump tls-cert=/etc/ssl/lab/inspection-ca.pem generate-host-certificates=on dynamic_cert_mem_cache_size=4MB
#sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/cache/squid/ssl_db -M 4MB
#tls_outgoing_options cafile=/etc/ssl/lab/ca.crt
#acl step1 at_step SslBump1
#acl no_inspection ssl::server_name .example.org
#ssl_bump peek step1
#ssl_bump splice no_inspection
#ssl_bump bump all

# Qui a le droit d'utiliser le proxy
acl lan src 192.0.2.0/26

# Ports autorisés : HTTP, et HTTPS seulement par la méthode CONNECT
acl Safe_ports port 80 443
acl SSL_ports port 443
acl CONNECT method CONNECT

# Filtrage d'URL : liste de domaines interdits
acl blocked dstdomain "/etc/squid/lab/blocked-domains.txt"

# Authentification (exercice) : décommenter les quatre lignes, puis remplacer
# « http_access allow lan » par « http_access allow lan users ».
# Compte de test : alice / lab-password
#auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/lab/passwords
#auth_param basic realm Proxy du lab
#auth_param basic credentialsttl 2 hours
#acl users proxy_auth REQUIRED

# Les règles sont lues dans l'ordre : la première qui correspond s'applique
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny blocked
http_access allow lan
http_access deny all

# Journal : date, adresse du poste, utilisateur, méthode, URL, code HTTP, octets, résultat
logformat lab %tl %>a %un %rm %ru %>Hs %<st %Ss/%Sh
access_log stdio:/var/log/squid/access.log lab
cache_log stdio:/var/log/squid/cache.log

# Pas de cache disque dans le lab
cache deny all
coredump_dir /var/cache/squid
