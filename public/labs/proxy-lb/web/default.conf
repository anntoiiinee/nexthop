# web1 et web2 : chaque serveur répond avec son nom et ce qu'il voit de la requête,
# pour observer le load balancing, le SNAT et les en-têtes ajoutés par le reverse proxy.
server {
    listen 80;
    default_type text/plain;

    location = /health {
        access_log off;
        return 200 "OK\n";
    }

    location / {
        return 200 "Servi par      : $hostname\nHost           : $host\nURI            : $request_uri\nIP source vue  : $remote_addr\nX-Forwarded-For: $http_x_forwarded_for\nX-Forwarded-Proto: $http_x_forwarded_proto\n";
    }
}
