# « Internet » : deux sites publics hébergés sur le même serveur, en HTTP et en HTTPS.
server {
    listen 80;
    listen 443 ssl;
    server_name www.example.com;
    ssl_certificate     /etc/ssl/lab/www.example.com.fullchain.crt;
    ssl_certificate_key /etc/ssl/lab/www.example.com.key;
    default_type text/plain;
    return 200 "Bienvenue sur www.example.com (vu depuis $remote_addr)\n";
}

server {
    listen 80;
    listen 443 ssl;
    server_name games.example.net;
    ssl_certificate     /etc/ssl/lab/www.example.com.fullchain.crt;
    ssl_certificate_key /etc/ssl/lab/www.example.com.key;
    default_type text/plain;
    return 200 "Jeux en ligne sur games.example.net (vu depuis $remote_addr)\n";
}

server {
    listen 80;
    listen 443 ssl;
    server_name bank.example.org;
    ssl_certificate     /etc/ssl/lab/www.example.com.fullchain.crt;
    ssl_certificate_key /etc/ssl/lab/www.example.com.key;
    default_type text/plain;
    return 200 "Votre banque en ligne, bank.example.org (vu depuis $remote_addr)\n";
}
