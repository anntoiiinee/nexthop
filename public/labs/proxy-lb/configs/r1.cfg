! r1 : switch L3 qui relie le LAN, la DMZ et « Internet »
hostname r1
username admin privilege 15 role network-admin secret admin
!
spanning-tree mode none
!
vlan 10
   name LAN
!
vlan 20
   name DMZ
!
interface Ethernet1
   description client
   switchport access vlan 10
!
interface Ethernet2
   description proxy
   switchport access vlan 10
!
interface Ethernet3
   description lb
   switchport access vlan 20
!
interface Ethernet4
   description web1
   switchport access vlan 20
!
interface Ethernet5
   description web2
   switchport access vlan 20
!
interface Ethernet6
   description INTERNET
   no switchport
   ip address 203.0.113.1/24
!
interface Vlan10
   description LAN
   ip address 192.0.2.1/26
!
interface Vlan20
   description DMZ
   ip address 198.51.100.1/24
!
ip routing
!
end
