hostname isp-b
!
service routing protocols model multi-agent
!
username admin privilege 15 role network-admin secret admin
!
interface Ethernet1
   description CLIENT-AS65010
   no switchport
   ip address 192.0.2.2/31
!
interface Ethernet2
   description INTERNET-AS65300
   no switchport
   ip address 192.0.2.6/31
!
interface Loopback0
   ip address 10.200.255.1/32
!
ip routing
!
! N'accepter du client que le préfixe qui lui appartient
ip prefix-list PL-CLIENT-AS65010 seq 10 permit 198.51.100.0/24
!
route-map RM-CLIENT-IN permit 10
   match ip address prefix-list PL-CLIENT-AS65010
!
router bgp 65200
   router-id 10.200.255.1
   neighbor 192.0.2.3 remote-as 65010
   neighbor 192.0.2.3 description CLIENT-AS65010
   neighbor 192.0.2.3 route-map RM-CLIENT-IN in
   neighbor 192.0.2.7 remote-as 65300
   neighbor 192.0.2.7 description INTERNET-AS65300
   !
   address-family ipv4
      neighbor 192.0.2.3 activate
      neighbor 192.0.2.7 activate
!
end
