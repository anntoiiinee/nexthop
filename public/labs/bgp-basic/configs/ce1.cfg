hostname ce1
!
service routing protocols model multi-agent
!
username admin privilege 15 role network-admin secret admin
!
interface Ethernet1
   description ISP-A
   no switchport
   ip address 192.0.2.1/31
!
interface Ethernet2
   description ISP-B
   no switchport
   ip address 192.0.2.3/31
!
interface Ethernet3
   description LAN-entreprise
   no switchport
   ip address 198.51.100.1/24
!
interface Loopback0
   ip address 10.255.0.10/32
!
ip routing
!
end
