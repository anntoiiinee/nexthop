hostname inet
!
service routing protocols model multi-agent
!
username admin privilege 15 role network-admin secret admin
!
interface Ethernet1
   description ISP-A
   no switchport
   ip address 192.0.2.5/31
!
interface Ethernet2
   description ISP-B
   no switchport
   ip address 192.0.2.7/31
!
interface Loopback0
   ip address 10.255.255.30/32
!
interface Loopback1
   description serveur-sur-internet
   ip address 203.0.113.1/24
!
ip routing
!
router bgp 65300
   router-id 10.255.255.30
   neighbor 192.0.2.4 remote-as 65100
   neighbor 192.0.2.4 description ISP-A
   neighbor 192.0.2.6 remote-as 65200
   neighbor 192.0.2.6 description ISP-B
   network 203.0.113.0/24
   !
   address-family ipv4
      neighbor 192.0.2.4 activate
      neighbor 192.0.2.6 activate
!
end
