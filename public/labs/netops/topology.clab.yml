name: netops

# Lab de la formation « L'automatisation ».
# Trois switches cEOS joignables depuis votre machine sur le réseau de management
# 172.20.30.0/24 : c'est là que les scripts Python et Ansible se connectent.

mgmt:
  network: netops-mgmt
  ipv4-subnet: 172.20.30.0/24

topology:
  kinds:
    arista_ceos:
      image: ceos:latest
  nodes:
    spine1:
      kind: arista_ceos
      mgmt-ipv4: 172.20.30.11
      startup-config: configs/spine1.cfg
      labels: { graph-level: 1 }
    leaf1:
      kind: arista_ceos
      mgmt-ipv4: 172.20.30.12
      startup-config: configs/leaf1.cfg
      labels: { graph-level: 2 }
    leaf2:
      kind: arista_ceos
      mgmt-ipv4: 172.20.30.13
      startup-config: configs/leaf2.cfg
      labels: { graph-level: 2 }

  links:
    - endpoints: ["spine1:eth1", "leaf1:eth1"]
    - endpoints: ["spine1:eth2", "leaf2:eth1"]
