# nms : serveur syslog central du lab netops (chapitre « SNMP, syslog et NetFlow »)
# Un fichier par équipement : /var/log/network/<nom>.log
module(load="imudp")
input(type="imudp" port="514")

template(name="PerHost" type="string" string="/var/log/network/%HOSTNAME%.log")
template(name="Line" type="string" string="%timereported:::date-rfc3339% %HOSTNAME% %syslogseverity-text% %msg%\n")

if $fromhost-ip != "127.0.0.1" then {
    action(type="omfile" dynaFile="PerHost" template="Line")
    stop
}
