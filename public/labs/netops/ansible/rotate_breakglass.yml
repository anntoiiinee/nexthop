---
# Rotation du compte local de secours (break-glass) : mêmes étapes que python/rotate_breakglass.py.
# Pour chaque équipement, un à la fois :
#   1. un mot de passe aléatoire et unique ;
#   2. écrit dans HashiCorp Vault (statut « pending ») AVANT de toucher à l'équipement ;
#   3. appliqué puis vérifié par une connexion eAPI indépendante ;
#   4. (option) suppression du compte admin par défaut ;
#   5. configuration enregistrée, puis secret passé au statut « active ».
# Secrets : moteur KV v2, secret/netops/breakglass/<équipement>. Vault garde les versions précédentes.
#
#   export NET_USER=svc-netops NET_PASSWORD='…'
#   export VAULT_ADDR=http://172.20.30.70:8200
#   export VAULT_TOKEN=…          # ou VAULT_ROLE_ID et VAULT_SECRET_ID (AppRole, dans un pipeline)
#   ansible-playbook ansible/rotate_breakglass.yml -e remove_default_admin=true

- name: Rotation du compte de secours, un équipement à la fois
  hosts: eos
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  vars:
    breakglass_user: nh-breakglass        # choisissez un nom propre à votre entreprise
    remove_default_admin: false
    vault_secret_path: "netops/breakglass/{{ inventory_hostname }}"
    vault_role_id: "{{ lookup('ansible.builtin.env', 'VAULT_ROLE_ID') }}"

  # Connexion à Vault commune à tous les modules community.hashi_vault : jeton (VAULT_TOKEN,
  # lu automatiquement) ou AppRole si VAULT_ROLE_ID est défini
  module_defaults:
    group/community.hashi_vault.vault:
      url: "{{ lookup('ansible.builtin.env', 'VAULT_ADDR') }}"
      engine_mount_point: secret
      auth_method: "{{ 'approle' if vault_role_id else 'token' }}"
      role_id: "{{ vault_role_id or omit }}"
      secret_id: "{{ lookup('ansible.builtin.env', 'VAULT_SECRET_ID') or omit }}"

  tasks:
    - name: Vérifier que l'adresse de Vault est définie
      ansible.builtin.assert:
        that: lookup('ansible.builtin.env', 'VAULT_ADDR') | length > 0
        fail_msg: Définissez VAULT_ADDR, puis VAULT_TOKEN (ou VAULT_ROLE_ID et VAULT_SECRET_ID).
      run_once: true
      delegate_to: localhost

    - name: Générer un mot de passe unique pour cet équipement
      ansible.builtin.set_fact:
        new_breakglass_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits', '-_.+=']) }}"
      no_log: true

    - name: Mettre le mot de passe au coffre, avant de toucher à l'équipement
      community.hashi_vault.vault_kv2_write:
        path: "{{ vault_secret_path }}"
        data:
          username: "{{ breakglass_user }}"
          password: "{{ new_breakglass_password }}"
          status: pending
      delegate_to: localhost
      no_log: true

    - name: Créer ou mettre à jour le compte de secours
      arista.eos.eos_config:
        lines:
          - "username {{ breakglass_user }} privilege 15 role network-admin secret {{ new_breakglass_password }}"
      no_log: true

    - name: Vérifier la connexion avec le nouveau mot de passe (eAPI, connexion indépendante)
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}/command-api"
        method: POST
        url_username: "{{ breakglass_user }}"
        url_password: "{{ new_breakglass_password }}"
        force_basic_auth: true
        validate_certs: false             # lab : certificat auto-signé
        body_format: json
        body:
          jsonrpc: "2.0"
          method: runCmds
          id: rotation
          params:
            version: 1
            cmds: ["show privilege"]
            format: text
      register: check
      failed_when: "'15' not in (check.json.result[0].output | default(''))"
      delegate_to: localhost
      no_log: true

    - name: Supprimer le compte admin par défaut
      arista.eos.eos_config:
        lines:
          - no username admin
      when: remove_default_admin | bool

    - name: Enregistrer la configuration
      arista.eos.eos_command:
        commands: write memory

    - name: Valider le mot de passe dans le coffre
      community.hashi_vault.vault_kv2_write:
        path: "{{ vault_secret_path }}"
        data:
          username: "{{ breakglass_user }}"
          password: "{{ new_breakglass_password }}"
          status: active
      delegate_to: localhost
      no_log: true
