---
# Rotation du compte local de secours (break-glass) : mêmes étapes que python/rotate_breakglass.py.
#   1. un mot de passe aléatoire et unique par équipement ;
#   2. écrit, chiffré, dans vault/breakglass.pending.yml AVANT de toucher aux équipements ;
#   3. appliqué puis vérifié par une connexion eAPI indépendante, un équipement à la fois ;
#   4. (option) suppression du compte admin par défaut ;
#   5. si tout a réussi, vault/breakglass.pending.yml devient vault/breakglass.yml.
#
#   export NET_USER=svc-netops NET_PASSWORD='…'
#   export ANSIBLE_VAULT_PASSWORD_FILE=$HOME/.vault_pass     # chemin absolu
#   ansible-playbook ansible/rotate_breakglass.yml -e remove_default_admin=true

- name: 1. Générer et mettre en sécurité les nouveaux mots de passe
  hosts: eos
  gather_facts: false
  vars: &rotation
    breakglass_user: nh-breakglass        # choisissez un nom propre à votre entreprise
    remove_default_admin: false
    vault_dir: "{{ playbook_dir }}/../vault"

  tasks:
    - name: Vérifier que le mot de passe du coffre est disponible
      ansible.builtin.assert:
        that: lookup('ansible.builtin.env', 'ANSIBLE_VAULT_PASSWORD_FILE') | length > 0
        fail_msg: Définissez ANSIBLE_VAULT_PASSWORD_FILE (fichier contenant le mot de passe du coffre).
      run_once: true
      delegate_to: localhost

    - name: Générer un mot de passe unique pour cet équipement
      ansible.builtin.set_fact:
        new_breakglass_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits', '-_.+=']) }}"
      no_log: true

    - name: Créer le dossier du coffre
      ansible.builtin.file:
        path: "{{ vault_dir }}"
        state: directory
        mode: "0700"
      run_once: true
      delegate_to: localhost

    # Le contenu passe par l'entrée standard d'ansible-vault : il n'est jamais écrit en clair sur le disque
    - name: Écrire le coffre en attente, chiffré, avant de toucher aux équipements
      ansible.builtin.command:
        cmd: ansible-vault encrypt --output {{ vault_dir }}/breakglass.pending.yml -
        stdin: "{{ pending | to_nice_yaml }}"
      changed_when: true
      vars:
        pending:
          breakglass_user: "{{ breakglass_user }}"
          breakglass_passwords: "{{ dict(ansible_play_hosts | zip(ansible_play_hosts | map('extract', hostvars, 'new_breakglass_password'))) }}"
      run_once: true
      delegate_to: localhost
      no_log: true

- name: 2. Appliquer et vérifier, un équipement à la fois
  hosts: eos
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  vars: *rotation

  tasks:
    - name: Créer ou mettre à jour le compte de secours
      arista.eos.eos_config:
        lines:
          - "username {{ breakglass_user }} privilege 15 role network-admin secret {{ new_breakglass_password }}"
      no_log: true

    - name: Vérifier la connexion avec le nouveau mot de passe (eAPI, connexion indépendante)
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}/command-api"
        method: POST
        url_username: "{{ breakglass_user }}"
        url_password: "{{ new_breakglass_password }}"
        force_basic_auth: true
        validate_certs: false             # lab : certificat auto-signé
        body_format: json
        body:
          jsonrpc: "2.0"
          method: runCmds
          id: rotation
          params:
            version: 1
            cmds: ["show privilege"]
            format: text
      register: check
      failed_when: "'15' not in (check.json.result[0].output | default(''))"
      delegate_to: localhost
      no_log: true

    - name: Supprimer le compte admin par défaut
      arista.eos.eos_config:
        lines:
          - no username admin
      when: remove_default_admin | bool

    - name: Enregistrer la configuration
      arista.eos.eos_command:
        commands: write memory

- name: 3. Valider la rotation
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Le coffre en attente devient le coffre courant
      ansible.builtin.command:
        cmd: mv vault/breakglass.pending.yml vault/breakglass.yml
        chdir: "{{ playbook_dir }}/.."
      changed_when: true
