hostname spine1
!
service routing protocols model multi-agent
!
! Compte par défaut, connu de tous : à supprimer (chapitre « Rotation du compte de secours »)
username admin privilege 15 role network-admin secret admin
! Compte de l'automatisation (en production : un compte de service TACACS+)
username svc-netops privilege 15 role network-admin secret netops-lab
!
interface Management0
   ip address 172.20.30.11/24
!
management api http-commands
   no shutdown
!
interface Ethernet1
   description leaf1
   no switchport
   ip address 10.0.1.0/31
!
interface Ethernet2
   description leaf2
   no switchport
   ip address 10.0.1.2/31
!
ip routing
!
end
