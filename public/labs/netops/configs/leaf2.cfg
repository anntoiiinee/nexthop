hostname leaf2
!
service routing protocols model multi-agent
!
! Compte par défaut, connu de tous : à supprimer (chapitre « Rotation du compte de secours »)
username admin privilege 15 role network-admin secret admin
! Compte de l'automatisation (en production : un compte de service TACACS+)
username svc-netops privilege 15 role network-admin secret netops-lab
!
interface Management0
   ip address 172.20.30.13/24
!
management api http-commands
   no shutdown
!
interface Ethernet1
   description spine1
   no switchport
   ip address 10.0.1.3/31
!
! Observabilité (formation « Services et observabilité »)
logging host 172.20.30.60
logging trap informational
snmp-server community nexthop-ro ro
snmp-server group SUPERVISION v3 priv
snmp-server user supervision SUPERVISION v3 auth sha256 Sup3rvision-lab priv aes Chiffr3ment-lab
!
management api gnmi
   transport grpc default
!
ip routing
!
end
