# Connexion aux équipements Arista EOS.
# Les identifiants viennent de variables d'environnement : jamais de mot de passe dans le dépôt.
#   export NET_USER=svc-netops NET_PASSWORD='…'
ansible_connection: ansible.netcommon.network_cli
ansible_network_os: arista.eos.eos
ansible_user: "{{ lookup('ansible.builtin.env', 'NET_USER') }}"
ansible_password: "{{ lookup('ansible.builtin.env', 'NET_PASSWORD') }}"
ansible_become: true
ansible_become_method: enable
