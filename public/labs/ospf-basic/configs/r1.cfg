hostname r1
!
service routing protocols model multi-agent
!
username admin privilege 15 role network-admin secret admin
!
interface Ethernet1
   description vers-r2
   no switchport
   ip address 10.0.12.0/31
!
interface Ethernet2
   description vers-r4
   no switchport
   ip address 10.0.14.0/31
!
interface Ethernet3
   description LAN-agence-A
   no switchport
   ip address 192.168.10.1/26
!
interface Loopback0
   description router-id
   ip address 10.255.0.1/32
!
ip routing
!
end
