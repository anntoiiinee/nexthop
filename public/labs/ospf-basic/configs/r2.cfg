hostname r2
!
service routing protocols model multi-agent
!
username admin privilege 15 role network-admin secret admin
!
interface Ethernet1
   description vers-r1
   no switchport
   ip address 10.0.12.1/31
!
interface Ethernet2
   description vers-r3
   no switchport
   ip address 10.0.23.0/31
!
interface Loopback0
   description router-id
   ip address 10.255.0.2/32
!
ip routing
!
end
